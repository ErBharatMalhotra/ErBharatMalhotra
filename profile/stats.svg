<svg xmlns="http://www.w3.org/2000/svg" width="350" height="310" viewBox="0 0 350 310">
  <style>
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .row { animation: fadeUp 0.5s ease both; }
    g:hover text { fill: #ffffff !important; }
  </style>
  <rect width="350" height="310" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="35" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">GitHub Stats</text>
  <text x="30" y="55" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">@ErBharatMalhotra</text>
  <line x1="20" y1="68" x2="330" y2="68" stroke="#30363d" stroke-width="1"/>
    <g class="row" style="animation-delay:0s">
      <text x="30" y="80" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Total Commits</text>
      <text x="320" y="80" fill="#39d353" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="end">18,170</text>
    </g>
    <g class="row" style="animation-delay:0.08s">
      <text x="30" y="124" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Current Streak</text>
      <text x="320" y="124" fill="#58a6ff" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="end">370 days</text>
    </g>
    <g class="row" style="animation-delay:0.16s">
      <text x="30" y="168" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Best Streak</text>
      <text x="320" y="168" fill="#f0c040" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="end">370 days</text>
    </g>
    <g class="row" style="animation-delay:0.24s">
      <text x="30" y="212" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Stars Earned</text>
      <text x="320" y="212" fill="#f9826c" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="end">8</text>
    </g>
    <g class="row" style="animation-delay:0.32s">
      <text x="30" y="256" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Public Repos</text>
      <text x="320" y="256" fill="#a855f7" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="end">12</text>
    </g>
</svg>