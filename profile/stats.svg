<svg xmlns="http://www.w3.org/2000/svg" width="350" height="316" viewBox="0 0 350 316">
  <style>
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  @keyframes slideIn { from { width: 0; } }
  @keyframes countUp { from { opacity: 0; } to { opacity: 1; } }
  .stat-row { animation: fadeIn 0.6s ease-out both; }
  .stat-row:nth-child(1) { animation-delay: 0.1s; }
  .stat-row:nth-child(2) { animation-delay: 0.2s; }
  .stat-row:nth-child(3) { animation-delay: 0.3s; }
  .stat-row:nth-child(4) { animation-delay: 0.4s; }
  .stat-row:nth-child(5) { animation-delay: 0.5s; }
  .stat-row:nth-child(6) { animation-delay: 0.6s; }
  .bar-fill { animation: slideIn 1s ease-out both; }
  .lang-row:hover .bar-fill { filter: brightness(1.3); }
  .lang-row:hover .lang-name { fill: #ffffff; }
  .contrib-cell { animation: fadeIn 0.3s ease-out both; }
  .stat-val { animation: countUp 0.8s ease-out both; }
  .glow { filter: drop-shadow(0 0 3px rgba(57,211,83,0.4)); }
</style>
  <rect width="350" height="316" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="35" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">GitHub Stats</text>
  <text x="30" y="55" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">@ErBharatMalhotra</text>
  <line x1="20" y1="72" x2="330" y2="72" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="88" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">11 public repos</text>
    <g class="stat-row">
      <text x="30" y="100" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Stars</text>
      <text x="320" y="100" fill="#f0c040" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="end" class="stat-val">8</text>
    </g>
    <g class="stat-row">
      <text x="30" y="136" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Commits</text>
      <text x="320" y="136" fill="#39d353" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="end" class="stat-val">18,168</text>
    </g>
    <g class="stat-row">
      <text x="30" y="172" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">PRs</text>
      <text x="320" y="172" fill="#a855f7" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="end" class="stat-val">4</text>
    </g>
    <g class="stat-row">
      <text x="30" y="208" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Issues</text>
      <text x="320" y="208" fill="#58a6ff" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="end" class="stat-val">4</text>
    </g>
    <g class="stat-row">
      <text x="30" y="244" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Followers</text>
      <text x="320" y="244" fill="#f9826c" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="end" class="stat-val">2</text>
    </g>
    <g class="stat-row">
      <text x="30" y="280" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Following</text>
      <text x="320" y="280" fill="#8b949e" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="end" class="stat-val">2</text>
    </g>
  <line x1="20" y1="288" x2="330" y2="288" stroke="#30363d" stroke-width="1"/>
  <text x="175" y="306" fill="#8b949e" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Updated 2026-08-21</text>
</svg>