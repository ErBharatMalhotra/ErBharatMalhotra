<svg xmlns="http://www.w3.org/2000/svg" width="495" height="160" viewBox="0 0 495 160">
  <defs>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <style>
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes countPulse { 0%,100%{ opacity:1; } 50%{ opacity:0.75; } }
  @keyframes shimmer { 0%{ stop-color:#06b6d4; } 50%{ stop-color:#a78bfa; } 100%{ stop-color:#06b6d4; } }
  @keyframes barGrow { from { width:0; } }
  .row { animation: fadeUp 0.5s ease both; }
  .row:nth-child(1) { animation-delay:.1s }
  .row:nth-child(2) { animation-delay:.2s }
  .row:nth-child(3) { animation-delay:.3s }
  .big-num { animation: fadeUp 0.6s ease both; animation-delay:.2s; }
  .bar { animation: barGrow 0.8s ease both; }
</style>
  </defs>
  <rect width="495" height="160" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <rect width="495" height="160" rx="16" fill="url(#sGrad)"/>

  <!-- Fire icon -->
  <text x="30" y="45" fill="#fb923c" font-family="Arial,sans-serif" font-size="28">&#x1F525;</text>
  <text x="65" y="38" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Streak</text>
  <text x="65" y="56" fill="#64748b" font-family="Arial,sans-serif" font-size="12">Keep the fire going!</text>

  <!-- Current streak — BIG -->
  <g class="row">
    <text x="170" y="35" fill="#64748b" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">CURRENT</text>
    <text x="170" y="75" fill="#06b6d4" font-family="Arial,sans-serif" font-size="42" font-weight="bold" text-anchor="middle" class="big-num">369</text>
    <text x="170" y="95" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">days</text>
  </g>

  <!-- Divider -->
  <line x1="260" y1="20" x2="260" y2="140" stroke="#1e293b" stroke-width="1"/>

  <!-- Best streak -->
  <g class="row">
    <text x="370" y="35" fill="#64748b" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">BEST STREAK</text>
    <text x="370" y="75" fill="#fbbf24" font-family="Arial,sans-serif" font-size="32" font-weight="bold" text-anchor="middle" class="big-num">369</text>
    <text x="370" y="95" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">days</text>
  </g>

  <!-- Total contributions -->
  <g class="row">
    <text x="370" y="125" fill="#64748b" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">TOTAL</text>
    <text x="370" y="148" fill="#10b981" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">18,168</text>
  </g>
</svg>