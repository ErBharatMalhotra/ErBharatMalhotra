<svg xmlns="http://www.w3.org/2000/svg" width="495" height="140" viewBox="0 0 495 140">
  <style>
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes glow { 0%,100%{ opacity:1; } 50%{ opacity:0.7; } }
    .row { animation: fadeUp 0.5s ease both; }
    .hero { animation: glow 2s ease infinite; }
  </style>
  <rect width="495" height="140" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Left: Current Streak -->
  <text x="120" y="30" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">CURRENT STREAK</text>
  <text x="120" y="75" fill="#58a6ff" font-family="Arial,sans-serif" font-size="40" font-weight="bold" text-anchor="middle" class="hero">370</text>
  <text x="120" y="95" fill="#8b949e" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">days</text>

  <!-- Divider -->
  <line x1="248" y1="15" x2="248" y2="125" stroke="#30363d" stroke-width="1"/>

  <!-- Right top: Best Streak -->
  <text x="370" y="30" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">BEST STREAK</text>
  <text x="370" y="70" fill="#f0c040" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle" class="row">370</text>
  <text x="370" y="90" fill="#8b949e" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">days</text>

  <!-- Right bottom: Total -->
  <text x="370" y="115" fill="#8b949e" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">TOTAL CONTRIBUTIONS</text>
  <text x="370" y="135" fill="#39d353" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">18,170</text>
</svg>