<svg xmlns="http://www.w3.org/2000/svg" width="350" height="290" viewBox="0 0 350 290">
  <style>
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
  @keyframes slideIn { from { width: 0; } }
  @keyframes countUp { from { opacity: 0; } to { opacity: 1; } }
  .stat-row { animation: fadeIn 0.6s ease-out both; }
  .stat-row:nth-child(1) { animation-delay: 0.1s; }
  .stat-row:nth-child(2) { animation-delay: 0.2s; }
  .stat-row:nth-child(3) { animation-delay: 0.3s; }
  .stat-row:nth-child(4) { animation-delay: 0.4s; }
  .stat-row:nth-child(5) { animation-delay: 0.5s; }
  .stat-row:nth-child(6) { animation-delay: 0.6s; }
  .bar-fill { animation: slideIn 1s ease-out both; }
  .lang-row:hover .bar-fill { filter: brightness(1.3); }
  .lang-row:hover .lang-name { fill: #ffffff; }
  .contrib-cell { animation: fadeIn 0.3s ease-out both; }
  .stat-val { animation: countUp 0.8s ease-out both; }
  .glow { filter: drop-shadow(0 0 3px rgba(57,211,83,0.4)); }

    .lang-row { transition: transform 0.2s; }
    .lang-row:hover { transform: translateX(4px); }
  </style>
  <rect width="350" height="290" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="40" fill="#e6edf3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Most Used Languages</text>
  <text x="40" y="60" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Based on public repositories</text>
  <line x1="30" y1="80" x2="320" y2="80" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="105" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Languages (4)</text>
  <text x="290" y="105" fill="#8b949e" font-family="Arial,sans-serif" font-size="12" text-anchor="end">11 repos</text>
    <g class="lang-row" style="cursor:pointer">
      <text x="40" y="125" fill="#8b949e" font-family="Arial,sans-serif" font-size="12" class="lang-name">Python</text>
      <rect x="40" y="130" width="250" height="14" rx="7" fill="#30363d"/>
      <rect x="40" y="130" width="125" height="14" rx="7" fill="#3572A5" class="bar-fill" style="animation-delay:0.3s"/>
      <text x="173" y="141" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">50.0%</text>
    </g>
    <g class="lang-row" style="cursor:pointer">
      <text x="40" y="155" fill="#8b949e" font-family="Arial,sans-serif" font-size="12" class="lang-name">JavaScript</text>
      <rect x="40" y="160" width="250" height="14" rx="7" fill="#30363d"/>
      <rect x="40" y="160" width="62.5" height="14" rx="7" fill="#f1e05a" class="bar-fill" style="animation-delay:0.44999999999999996s"/>
      <text x="110.5" y="171" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">25.0%</text>
    </g>
    <g class="lang-row" style="cursor:pointer">
      <text x="40" y="185" fill="#8b949e" font-family="Arial,sans-serif" font-size="12" class="lang-name">C</text>
      <rect x="40" y="190" width="250" height="14" rx="7" fill="#30363d"/>
      <rect x="40" y="190" width="31.25" height="14" rx="7" fill="#555555" class="bar-fill" style="animation-delay:0.6s"/>
      <text x="79.25" y="201" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">12.5%</text>
    </g>
    <g class="lang-row" style="cursor:pointer">
      <text x="40" y="215" fill="#8b949e" font-family="Arial,sans-serif" font-size="12" class="lang-name">TypeScript</text>
      <rect x="40" y="220" width="250" height="14" rx="7" fill="#30363d"/>
      <rect x="40" y="220" width="31.25" height="14" rx="7" fill="#3178c6" class="bar-fill" style="animation-delay:0.75s"/>
      <text x="79.25" y="231" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">12.5%</text>
    </g>
</svg>