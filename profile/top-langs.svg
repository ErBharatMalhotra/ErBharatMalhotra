<svg xmlns="http://www.w3.org/2000/svg" width="350" height="276" viewBox="0 0 350 276">
  <defs>
    <linearGradient id="gLang" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <style>
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes countPulse { 0%,100%{ opacity:1; } 50%{ opacity:0.75; } }
  @keyframes shimmer { 0%{ stop-color:#06b6d4; } 50%{ stop-color:#a78bfa; } 100%{ stop-color:#06b6d4; } }
  @keyframes barGrow { from { width:0; } }
  .row { animation: fadeUp 0.5s ease both; }
  .row:nth-child(1) { animation-delay:.1s }
  .row:nth-child(2) { animation-delay:.2s }
  .row:nth-child(3) { animation-delay:.3s }
  .big-num { animation: fadeUp 0.6s ease both; animation-delay:.2s; }
  .bar { animation: barGrow 0.8s ease both; }
</style>
  </defs>
  <rect width="350" height="276" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <rect width="350" height="276" rx="16" fill="url(#gLang)"/>
  <text x="40" y="38" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Top Languages</text>
  <text x="40" y="58" fill="#64748b" font-family="Arial,sans-serif" font-size="12">11 repos analyzed</text>
  <line x1="30" y1="72" x2="320" y2="72" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="92" fill="#64748b" font-family="Arial,sans-serif" font-size="11">4 languages</text>
    <g class="row">
      <text x="40" y="104" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Python</text>
      <text x="310" y="104" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="end">50.0%</text>
      <rect x="40" y="110" width="260" height="16" rx="8" fill="#0a0e1a"/>
      <rect x="40" y="110" width="130" height="16" rx="8" fill="#3572A5" class="bar" style="animation-delay:0.2s"/>
    </g>
    <g class="row">
      <text x="40" y="138" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="13" font-weight="bold">JavaScript</text>
      <text x="310" y="138" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="end">25.0%</text>
      <rect x="40" y="144" width="260" height="16" rx="8" fill="#0a0e1a"/>
      <rect x="40" y="144" width="65" height="16" rx="8" fill="#f1e05a" class="bar" style="animation-delay:0.32s"/>
    </g>
    <g class="row">
      <text x="40" y="172" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="13" font-weight="bold">C</text>
      <text x="310" y="172" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="end">12.5%</text>
      <rect x="40" y="178" width="260" height="16" rx="8" fill="#0a0e1a"/>
      <rect x="40" y="178" width="32.5" height="16" rx="8" fill="#555555" class="bar" style="animation-delay:0.44s"/>
    </g>
    <g class="row">
      <text x="40" y="206" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="13" font-weight="bold">TypeScript</text>
      <text x="310" y="206" fill="#64748b" font-family="Arial,sans-serif" font-size="12" text-anchor="end">12.5%</text>
      <rect x="40" y="212" width="260" height="16" rx="8" fill="#0a0e1a"/>
      <rect x="40" y="212" width="32.5" height="16" rx="8" fill="#3178c6" class="bar" style="animation-delay:0.56s"/>
    </g>
</svg>