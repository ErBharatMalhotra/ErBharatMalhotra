<svg xmlns="http://www.w3.org/2000/svg" width="350" height="230" viewBox="0 0 350 230">
  <style>
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .row { animation: fadeUp 0.5s ease both; }
    g:hover text { fill: #ffffff !important; }
    g:hover rect[rx="6"] { filter: brightness(1.3); }
  </style>
  <rect width="350" height="230" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="35" fill="#e6edf3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Top Languages</text>
  <text x="40" y="55" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">14 repos</text>
  <line x1="30" y1="68" x2="320" y2="68" stroke="#30363d" stroke-width="1"/>
    <g class="row" style="animation-delay:0s">
      <text x="40" y="90" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12">Python</text>
      <text x="310" y="90" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="end">50.0%</text>
      <rect x="40" y="94" width="230" height="12" rx="6" fill="#30363d"/>
      <rect x="40" y="94" width="115" height="12" rx="6" fill="#3572A5"/>
    </g>
    <g class="row" style="animation-delay:0.08s">
      <text x="40" y="120" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12">JavaScript</text>
      <text x="310" y="120" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="end">30.0%</text>
      <rect x="40" y="124" width="230" height="12" rx="6" fill="#30363d"/>
      <rect x="40" y="124" width="69" height="12" rx="6" fill="#f1e05a"/>
    </g>
    <g class="row" style="animation-delay:0.16s">
      <text x="40" y="150" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12">C</text>
      <text x="310" y="150" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="end">10.0%</text>
      <rect x="40" y="154" width="230" height="12" rx="6" fill="#30363d"/>
      <rect x="40" y="154" width="23" height="12" rx="6" fill="#555555"/>
    </g>
    <g class="row" style="animation-delay:0.24s">
      <text x="40" y="180" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12">TypeScript</text>
      <text x="310" y="180" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="end">10.0%</text>
      <rect x="40" y="184" width="230" height="12" rx="6" fill="#30363d"/>
      <rect x="40" y="184" width="23" height="12" rx="6" fill="#3178c6"/>
    </g>
</svg>