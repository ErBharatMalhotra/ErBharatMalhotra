name: Generate Profile Stats

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─────────────────────────────────────────────
      # 1. GitHub Readme Stats (stats.svg + top-langs.svg)
      # ─────────────────────────────────────────────
      - name: Generate stats.svg
        uses: anuraghazra/github-readme-stats@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ErBharatMalhotra
          show_icons: true
          theme: tokyo-night
          include_all_commits: true
          count_private: true
          card_width: 255
          hide_border: false
          custom_title: GitHub Stats

      - name: Generate top-langs.svg
        uses: anuraghazra/github-readme-stats@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ErBharatMalhotra
          show_icons: true
          theme: tokyo-night
          card_width: 255
          hide_border: false
          custom_title: Most Used Languages
          langs_count: 8
          layout: compact

      # ─────────────────────────────────────────────
      # 2. Snake Animation (github-contribution-grid-snake.svg)
      # ─────────────────────────────────────────────
      - name: Generate snake.svg
        uses: platane/snk@v3
        with:
          github_user_name: ErBharatMalhotra
          outputs: profile/github-contribution-grid-snake.svg
          svg_out_dark: profile/github-contribution-grid-snake-dark.svg
          svg_out: profile/github-contribution-grid-snake.svg

      # ─────────────────────────────────────────────
      # 3. Commit and push all generated SVGs
      # ─────────────────────────────────────────────
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
