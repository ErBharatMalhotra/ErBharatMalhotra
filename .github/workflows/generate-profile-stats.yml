name: Generate Profile Stats

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats SVGs
        run: |
          mkdir -p profile

          echo "📊 Fetching stats.svg..."
          curl -s -o profile/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=ErBharatMalhotra&show_icons=true&theme=tokyo-night&include_all_commits=true&count_private=true&hide_border=false"

          echo "📊 Fetching top-langs.svg..."
          curl -s -o profile/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=ErBharatMalhotra&show_icons=true&theme=tokyo-night&hide_border=false&langs_count=8&layout=compact"

          echo "✅ Stats SVGs fetched!"

      - name: Generate snake contribution graph
        uses: platane/snk@v3
        with:
          github_user_name: ErBharatMalhotra
          outputs: profile/github-contribution-grid-snake.svg, profile/github-contribution-grid-snake-dark.svg

      - name: Verify all SVG files
        run: |
          echo "📁 Generated files:"
          ls -la profile/
          echo ""
          for f in profile/*.svg; do
            if [ -s "$f" ]; then
              echo "✅ $f — $(wc -c < "$f") bytes"
            else
              echo "❌ $f — EMPTY!"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "chore: update profile stats [skip ci]"
            git push
          fi
