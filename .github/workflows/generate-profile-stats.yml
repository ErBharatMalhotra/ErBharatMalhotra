name: Generate Profile Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm init -y && npm install axios

      - name: Generate all profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile
          node .github/scripts/generate-stats.js

      - name: Generate snake contribution graph
        uses: platane/snk@v3
        with:
          github_user_name: ErBharatMalhotra
          outputs: profile/github-contribution-grid-snake.svg

      - name: Verify all SVG files
        run: |
          echo "📁 Generated files:"
          for f in profile/*.svg; do
            if [ -s "$f" ]; then
              echo "✅ $f — $(wc -c < "$f") bytes"
            else
              echo "❌ $f — EMPTY!"
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "chore: update profile stats [skip ci]"
            git push
          fi
